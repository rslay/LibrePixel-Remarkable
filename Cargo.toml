[package]
name = "librepixel"
version = "0.2.0"
edition = "2021"
default-run = "librepixel"
description = "reMarkable 2 apps on AppLoad/qtfb: a pixel-art editor and a hello world"
license = "GPL-2.0-only"

[lib]
name = "librepixel"
path = "src/lib.rs"

[dependencies]
# All pure Rust, so the static musl build needs no C compiler. Licences: MIT (dual MIT/Apache).
miniz_oxide = "0.8"   # zlib for .ase cels and PDF streams
png = "0.17"          # PNG import/export
jpeg-encoder = "0.6"  # JPG export

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The editor.
[[bin]]
name = "librepixel"
path = "src/bin/librepixel/main.rs"

# The original hello world; kept as the smoke test for the build + deploy pipeline.
[[bin]]
name = "hello"
path = "src/bin/hello.rs"

# PC-only stand-in for the on-device qtfb server, used by tools/run_local_test.sh
[[bin]]
name = "fake_qtfb_server"
path = "src/bin/fake_qtfb_server.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
